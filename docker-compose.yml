# MailMotion self-hosted stack.
#   cp .env.example .env   (set MM_UPLOAD_TOKEN at least)
#   docker compose up -d
# Optional: --profile minio  (local S3), --profile github (GitHub sign-in function)

services:
  caddy:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
        NEXT_PUBLIC_GITHUB_APP_SLUG: ${NEXT_PUBLIC_GITHUB_APP_SLUG:-}
        NEXT_PUBLIC_PUBLISH_FN_URL: ${NEXT_PUBLIC_PUBLISH_FN_URL:-}
        NEXT_PUBLIC_ANALYTICS_SRC: ${NEXT_PUBLIC_ANALYTICS_SRC:-}
        NEXT_PUBLIC_ANALYTICS_DOMAIN: ${NEXT_PUBLIC_ANALYTICS_DOMAIN:-}
    environment:
      MM_DOMAIN: ${MM_DOMAIN:-localhost}
      MM_IMG_DOMAIN: ${MM_IMG_DOMAIN:-img.localhost}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - storage
    restart: unless-stopped

  storage:
    build:
      context: .
      dockerfile: docker/storage-server.Dockerfile
    environment:
      MM_STORAGE: ${MM_STORAGE:-disk}
      MM_PUBLIC_BASE_URL: ${MM_PUBLIC_BASE_URL:-https://img.localhost}
      MM_UPLOAD_TOKEN: ${MM_UPLOAD_TOKEN:?set MM_UPLOAD_TOKEN in .env (openssl rand -hex 32)}
      MM_ALLOWED_ORIGINS: ${MM_ALLOWED_ORIGINS:-https://localhost}
      MM_TRUST_PROXY: '1'
      MM_DATA_DIR: /data/files
      MM_S3_ENDPOINT: ${MM_S3_ENDPOINT:-}
      MM_S3_REGION: ${MM_S3_REGION:-auto}
      MM_S3_BUCKET: ${MM_S3_BUCKET:-mailmotion}
      MM_S3_ACCESS_KEY_ID: ${MM_S3_ACCESS_KEY_ID:-}
      MM_S3_SECRET_ACCESS_KEY: ${MM_S3_SECRET_ACCESS_KEY:-}
    volumes:
      - mm-data:/data
    expose:
      - '8787'
    restart: unless-stopped

  # --profile minio: a local S3-compatible bucket (set MM_STORAGE=minio, MM_S3_ENDPOINT=http://minio:9000)
  minio:
    profiles: ['minio']
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MM_S3_ACCESS_KEY_ID:-mailmotion}
      MINIO_ROOT_PASSWORD: ${MM_S3_SECRET_ACCESS_KEY:-change-me-please}
    volumes:
      - minio-data:/data
    expose:
      - '9000'
      - '9001'

  # --profile github: the token-exchange function for one-click GitHub Pages publishing (Path B)
  publish-fn:
    profiles: ['github']
    build:
      context: .
      dockerfile: docker/publish-fn.Dockerfile
    environment:
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
      ALLOWED_ORIGINS: ${MM_ALLOWED_ORIGINS:-https://localhost}
    ports:
      - '8788:8788'
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
  mm-data:
  minio-data:
