name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # renders the landing gallery with the real renderer and copies fonts (needed by typecheck/build)
      - run: pnpm --filter @mailmotion/web prepare-assets
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm format:check
      - run: pnpm --filter @mailmotion/web build
        env:
          # Bakes a one-click "Upload images" button into the build, pointed at the storage
          # server the e2e job starts on :8787 (see apps/web/playwright.config.ts webServer).
          NEXT_PUBLIC_UPLOAD_ENDPOINT: http://localhost:8787
          NEXT_PUBLIC_UPLOAD_TOKEN: e2e-upload-token-0123456789abcdef
      - run: pnpm --filter mailmotion build
      - uses: actions/upload-artifact@v4
        with:
          name: web-out
          path: apps/web/out
          retention-days: 3

  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: web-out
          path: apps/web/out
      - run: pnpm --filter @mailmotion/web exec playwright install --with-deps chromium
      - run: pnpm --filter @mailmotion/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compose file is valid
        env:
          MM_UPLOAD_TOKEN: ci-token-ci-token-ci-token-ci-token
        run: docker compose --profile minio --profile github config -q
      - name: images build
        env:
          MM_UPLOAD_TOKEN: ci-token-ci-token-ci-token-ci-token
        run: docker compose build

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every commit
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          for c in $(git rev-list --no-merges "$base..$head"); do
            if ! git show -s --format=%B "$c" | grep -qi '^Signed-off-by: '; then
              echo "Missing Signed-off-by: $c"; missing=1
            fi
          done
          exit $missing
